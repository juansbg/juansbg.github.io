# The relay: one Worker, one Durable Object per room. See docs/BIG-SCREEN.md §5.
#
#   npm run relay:dev      local, no account needed (Miniflare)
#   npm run relay:deploy   needs `npx wrangler login` once on this machine
#
# The free plan runs Durable Objects on SQLite storage, hence new_sqlite_classes.
name = "omerta-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Who may talk to the relay at all: only pages served from the site. Browsers
# always send Origin on a cross-site POST and on a WebSocket handshake; a
# request without one is not a page of ours. Local overrides live in
# relay/.dev.vars (not committed): ALLOWED_ORIGINS="*" and a ROOM_KEY.
[vars]
ALLOWED_ORIGINS = "https://juansbg.github.io"

# Opening a room needs ROOM_KEY, a secret set once with
#   npx wrangler secret put ROOM_KEY -c relay/wrangler.toml
# and typed into the phone's Big screen sheet. Without it nobody can open a
# room, and without a room nothing else on the relay does anything.

# Thirty handshakes or room openings a minute per address. Enough for a
# table full of phones reconnecting, not enough to burn the day's quota.
[[ratelimits]]
name = "RATE"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[durable_objects]
bindings = [{ name = "ROOM", class_name = "Room" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
