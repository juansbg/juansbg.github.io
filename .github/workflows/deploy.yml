name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm run test

      - name: Build v3
        run: npm run build

      # The site root must keep serving the existing v1 app until the Sprint 5
      # cutover, so the artifact is assembled from two sources:
      #   dist/        <- legacy/v1 (live site, unchanged)
      #   dist/beta/   <- v3 (built above by vite, already in place)
      #   dist/legacy/v2/ <- the abandoned 2022 rewrite, kept reachable
      - name: Assemble site
        run: |
          cp -R legacy/v1/. dist/
          mkdir -p dist/legacy/v2
          cp -R legacy/v2/. dist/legacy/v2/
          test -f dist/index.html || { echo "v1 index.html missing from site root"; exit 1; }
          test -f dist/beta/index.html || { echo "v3 index.html missing from /beta/"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
