name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm run test

      - name: Build
        run: npm run build

      # v3 is the whole site. /beta/ carries only the redirect and the worker
      # that retires the beta's; the legacy trees stay in the repo, not on the site.
      - name: Check the artifact
        run: |
          test -f dist/index.html || { echo "index.html missing from site root"; exit 1; }
          test -f dist/sw.js || { echo "service worker missing"; exit 1; }
          test -f dist/beta/index.html || { echo "beta redirect missing"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
